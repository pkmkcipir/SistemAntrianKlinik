<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layar Antrian</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #eaf1ee; color: #10252b;
  font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
html { font-size: 1.852vh; } /* 1rem = 20px pada layar 1080p; semua ukuran ikut tinggi layar */
.num { font-family: Bahnschrift, "Segoe UI", Roboto, Arial, sans-serif; }

#app { display: flex; flex-direction: column; height: 100%; }
#hdr { flex: none; background: #0e6b67; color: #fff; display: flex; align-items: center;
  justify-content: space-between; padding: .7rem 1.6rem; }
#nama { font-size: 2.3rem; font-weight: 700; line-height: 1.2; }
#alamat, #telp { font-size: 1.1rem; color: #bfeae3; line-height: 1.3; }
#waktu { text-align: right; white-space: nowrap; margin-left: 1.5rem; }
#tgl { font-size: 1.3rem; }
#jam { font-size: 2.2rem; font-weight: 700; }

#body { flex: 1; display: flex; padding: 1rem 1.2rem; min-height: 0; }
#vbox { flex: 62; position: relative; background: #0a1517; margin-right: 1.2rem; min-width: 0; }
#vid { width: 100%; height: 100%; background: #000; object-fit: contain; display: block; }
#vph { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center;
  justify-content: center; text-align: center; color: #8fb3ad; font-size: 1.6rem; padding: 2rem;
  white-space: pre-line; }

#right { flex: 38; display: flex; flex-direction: column; min-width: 0; }
#called { flex: 3; background: #0e6b67; color: #fff; padding: .9rem 1.6rem; display: flex;
  flex-direction: column; min-height: 0; transition: background .2s; }
#called.flash { background: #f2b705; color: #10252b; }
#ccap { font-size: 1.4rem; font-weight: 700; }
#cnum { flex: 1; min-height: 0; display: flex; align-items: center; overflow: hidden; }
#cnumtxt { font-weight: 700; line-height: 1; white-space: nowrap; font-size: 11.5rem; }
#cpoli { font-size: 2.1rem; font-weight: 700; line-height: 1.2; }
#cloket { font-size: 1.5rem; line-height: 1.3; }

#board { flex: 2; background: #fff; margin-top: .8rem; padding: .4rem 0; display: flex;
  flex-direction: column; min-height: 0; }
.row { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.2rem; border-bottom: 1px solid #d9e6e2; overflow: hidden; }
.row .nm { font-size: 1.5em; font-weight: 700; line-height: 1.2; }
.row .if { font-size: 1em; color: #5f7a76; line-height: 1.2; }
.row .kd { font-size: 2.7em; font-weight: 700; color: #0e6b67; margin-left: 1rem; white-space: nowrap; line-height: 1; }

#ftr { flex: none; background: #093f3c; color: #fff; }
#mq { overflow: hidden; white-space: nowrap; height: 3rem; line-height: 3rem; font-size: 1.7rem; font-weight: 700; }
#mqt { display: inline-block; padding-left: 100%; animation: mq 40s linear infinite; }
@keyframes mq { from { transform: translateX(0); } to { transform: translateX(-100%); } }
#mark { text-align: center; color: #a7e3da; font-size: 1rem; padding: .1rem 0 .4rem; }

#unlock { position: absolute; left: 50%; bottom: 1.5rem; margin-left: -17rem; width: 34rem; text-align: center;
  background: #f2b705; color: #10252b; font-size: 1.4rem; font-weight: 700; padding: .7rem 1rem;
  border-radius: .6rem; cursor: pointer; z-index: 5; box-shadow: 0 .3rem 1rem rgba(0,0,0,.3); }
#off { position: fixed; left: 0; right: 0; top: 0; background: #c2410c; color: #fff; text-align: center;
  font-size: 1.2rem; padding: .4rem; z-index: 6; display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div>
      <div id="nama">Layar Antrian</div>
      <div id="alamat"></div>
      <div id="telp"></div>
    </div>
    <div id="waktu"><div id="tgl"></div><div id="jam" class="num"></div></div>
  </div>
  <div id="body">
    <div id="vbox">
      <video id="vid" muted autoplay playsinline></video>
      <div id="vph">Video edukasi belum ditambahkan.
Tambahkan lewat menu Video Edukasi di aplikasi.</div>
      <div id="unlock">Tekan OK / klik sekali untuk mengaktifkan suara</div>
    </div>
    <div id="right">
      <div id="called">
        <div id="ccap">Sedang dipanggil</div>
        <div id="cnum"><span id="cnumtxt" class="num">&mdash;</span></div>
        <div id="cpoli"></div>
        <div id="cloket"></div>
      </div>
      <div id="board"></div>
    </div>
  </div>
  <div id="ftr">
    <div id="mq"><span id="mqt"></span></div>
    <div id="mark"></div>
  </div>
</div>
<div id="off">Menghubungkan ke aplikasi antrian...</div>

<script>
(function () {
  var HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  var BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September',
               'Oktober', 'November', 'Desember'];
  var SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
  function $(id) { return document.getElementById(id); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function setText(el, t) { if (el.textContent !== t) { el.textContent = t; } }

  var offset = 0, tz = 420;
  var vol = 0.4, unlocked = false, voiceOn = true;
  var vid = $('vid');
  var chime = null, voiceEl = null, lastSeq = null, lastCall = null, pend = null, safety = null;

  // ---------- jam & tanggal (memakai waktu server supaya jam TV yang salah tidak berpengaruh) ----------
  function tick() {
    var t = new Date(new Date().getTime() + offset + tz * 60000);
    setText($('tgl'), HARI[t.getUTCDay()] + ', ' + t.getUTCDate() + ' ' + BULAN[t.getUTCMonth()] + ' ' + t.getUTCFullYear());
    setText($('jam'), pad(t.getUTCHours()) + ':' + pad(t.getUTCMinutes()) + ':' + pad(t.getUTCSeconds()));
  }

  // ---------- angka besar: kecilkan huruf sampai muat ----------
  function fitNumber() {
    var box = $('cnum'), txt = $('cnumtxt');
    var size = Math.round(window.innerHeight * 0.213);
    txt.style.fontSize = size + 'px';
    while (size > 24 && (txt.offsetWidth > box.clientWidth || txt.offsetHeight > box.clientHeight)) {
      size -= 6;
      txt.style.fontSize = size + 'px';
    }
  }

  // ---------- teks berjalan ----------
  var mqText = null;
  function setMarquee(t) {
    if (t === mqText) { return; }
    mqText = t;
    var el = $('mqt');
    el.textContent = t;
    var w = el.scrollWidth + $('mq').clientWidth;
    el.style.animationDuration = Math.max(15, w / (window.innerHeight * 0.13)) + 's';
  }

  // ---------- daftar layanan ----------
  var rowSig = '', rows = [];
  function setRows(poli) {
    var sig = '';
    for (var i = 0; i < poli.length; i++) { sig += poli[i].id + ':' + poli[i].nama + '|'; }
    var board = $('board');
    if (sig !== rowSig) {
      rowSig = sig; rows = [];
      while (board.firstChild) { board.removeChild(board.firstChild); }
      for (var j = 0; j < poli.length; j++) {
        var r = document.createElement('div'); r.className = 'row';
        var l = document.createElement('div');
        var n = document.createElement('div'); n.className = 'nm';
        var f = document.createElement('div'); f.className = 'if';
        l.appendChild(n); l.appendChild(f);
        var k = document.createElement('div'); k.className = 'kd num';
        r.appendChild(l); r.appendChild(k); board.appendChild(r);
        rows.push({ nm: n, inf: f, kd: k });
      }
      var scale = poli.length > 4 ? 4 / poli.length : 1;
      board.style.fontSize = scale + 'rem';
    }
    for (var m = 0; m < poli.length; m++) {
      var p = poli[m], t = p.menunggu + ' menunggu' + (p.berikut.length ? ', berikut ' + p.berikut.join(', ') : '');
      setText(rows[m].nm, p.nama); setText(rows[m].inf, t); setText(rows[m].kd, p.sekarang);
    }
  }

  // ---------- video edukasi ----------
  var vids = [], vsig = null, vidx = -1, vfail = 0, vtoken = 0, vadv = -1, tLoad = 0;
  function applyVol(duck) { try { vid.volume = Math.max(0, Math.min(1, vol * (duck ? 0.12 : 1))); } catch (e) {} }
  function placeholder(show, msg) {
    var ph = $('vph');
    ph.style.display = show ? 'flex' : 'none';
    if (msg) { ph.textContent = msg; }
  }
  function nextVideo() {
    if (!vids.length) { return; }
    vtoken++; vidx = (vidx + 1) % vids.length; tLoad = new Date().getTime();
    vid.src = vids[vidx].url;
    try { vid.load(); } catch (e) {}
    var p = vid.play();
    if (p && p.catch) { p.catch(function () {}); }
  }
  function advance(delay) {
    if (vadv === vtoken) { return; }
    vadv = vtoken;
    setTimeout(nextVideo, delay || 0);
  }
  function gagal() {
    if (vadv === vtoken || !vids.length) { return; }
    vfail++;
    if (vfail > vids.length) {
      vadv = vtoken;
      placeholder(true, 'Video tidak dapat diputar.\nGunakan format MP4 (H.264 + AAC).');
      return;
    }
    advance(800);
  }
  vid.addEventListener('ended', function () {
    if (new Date().getTime() - tLoad < 700) { gagal(); } else { vfail = 0; advance(0); }
  });
  vid.addEventListener('error', gagal);
  vid.addEventListener('playing', function () { vfail = 0; });
  function syncVideos(list) {
    var sig = '';
    for (var i = 0; i < list.length; i++) { sig += list[i].id + ','; }
    if (sig === vsig) { return; }
    vsig = sig; vids = list; vidx = -1; vfail = 0; vadv = -1;
    if (!vids.length) {
      vid.pause(); vid.removeAttribute('src'); placeholder(true, 'Video edukasi belum ditambahkan.\nTambahkan lewat menu Video Edukasi di aplikasi.');
      return;
    }
    placeholder(false);
    vid.loop = vids.length === 1;
    nextVideo();
  }

  // ---------- panggilan: kedip + ting-tung + suara ----------
  function flash() {
    var el = $('called'), n = 0;
    var iv = setInterval(function () {
      n++;
      el.className = (n % 2 === 1 && n < 14) ? 'flash' : '';
      if (n >= 14) { clearInterval(iv); el.className = ''; }
    }, 420);
  }
  function endCall() { applyVol(false); pend = null; clearTimeout(safety); }
  function announce(c) {
    flash();
    if (!unlocked || !voiceOn) { return; }
    pend = { seq: c.seq, chimeDone: false, spoke: false };
    applyVol(true);
    clearTimeout(safety); safety = setTimeout(endCall, 25000);
    try { chime.pause(); chime.currentTime = 0; var p = chime.play(); if (p && p.catch) { p.catch(function () {}); } } catch (e) {}
    setTimeout(function () { if (pend && pend.seq === c.seq) { pend.chimeDone = true; tryVoice(); } }, 1400);
  }
  function tryVoice() {
    var c = lastCall;
    if (!pend || !c || c.seq !== pend.seq || pend.spoke || !pend.chimeDone) { return; }
    if (c.gagal && !c.audio) { endCall(); return; }
    if (!c.audio) { return; }  // suara belum siap: dicek lagi pada polling berikutnya
    pend.spoke = true;
    voiceEl.onended = endCall; voiceEl.onerror = endCall;
    voiceEl.src = c.audio;
    var p = voiceEl.play();
    if (p && p.catch) { p.catch(endCall); }
  }
  function handleCall(c) {
    lastCall = c;
    if (lastSeq === null) { lastSeq = c.seq; return; }  // buka halaman: jangan bunyikan panggilan lama
    if (c.seq !== lastSeq) { lastSeq = c.seq; announce(c); }
    tryVoice();
  }

  // ---------- aktifkan suara (browser mewajibkan satu sentuhan/klik) ----------
  function unlock() {
    if (unlocked) { return; }
    unlocked = true;
    $('unlock').style.display = 'none';
    vid.muted = false; applyVol(false);
    var p = vid.play(); if (p && p.catch) { p.catch(function () {}); }
    voiceEl = new Audio(); voiceEl.src = SILENT;
    var q = voiceEl.play(); if (q && q.catch) { q.catch(function () {}); }
    chime = new Audio('/chime.wav');
    var r = chime.play(); if (r && r.catch) { r.catch(function () {}); }  // bunyi konfirmasi
  }
  document.addEventListener('click', unlock);
  document.addEventListener('keydown', unlock);
  document.addEventListener('touchstart', unlock);

  // ---------- ambil data dari aplikasi ----------
  function render(st) {
    offset = st.epoch * 1000 - new Date().getTime(); tz = st.tz;
    if (!st.ready) { return; }
    setText($('nama'), st.klinik.nama || '');
    setText($('alamat'), st.klinik.alamat || '');
    setText($('telp'), st.klinik.telepon ? 'Telp/WA ' + st.klinik.telepon : '');
    setText($('mark'), st.mark || '');
    setMarquee(st.teks || '');
    vol = (st.volume || 0) / 100; voiceOn = !!st.suara;
    if (unlocked && !pend) { applyVol(false); }
    setRows(st.poli);
    var t = st.terakhir;
    setText($('cnumtxt'), t ? t.kode : '\u2014'); setText($('cpoli'), t ? t.poli : 'Belum ada panggilan');
    setText($('cloket'), t ? t.loket : '');
    fitNumber();
    syncVideos(st.video || []);
    handleCall(st.call);
  }
  function poll() {
    var x = new XMLHttpRequest();
    x.open('GET', '/api/state?_=' + new Date().getTime(), true);
    x.timeout = 4000;
    x.onload = function () {
      var ok = false;
      try { render(JSON.parse(x.responseText)); ok = true; } catch (e) { if (window.console) { console.log(e); } }
      $('off').style.display = ok ? 'none' : 'block';
      setTimeout(poll, 1000);
    };
    x.onerror = x.ontimeout = function () { $('off').style.display = 'block'; setTimeout(poll, 2000); };
    x.send();
  }

  window.addEventListener('resize', fitNumber);
  setInterval(tick, 500); tick();
  poll();
})();
</script>
</body>
</html>
