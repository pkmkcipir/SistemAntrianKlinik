<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layar Antrian</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #eaf1ee; color: #10252b;
  font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
html { font-size: 1.852vh; } /* 1rem = 20px pada layar 1080p; semua ukuran ikut tinggi layar */
.num { font-family: Bahnschrift, "Segoe UI", Roboto, Arial, sans-serif; }

#app { display: flex; flex-direction: column; height: 100%; }
#hdr { flex: none; background: #0e6b67; color: #fff; display: flex; align-items: center;
  justify-content: space-between; padding: .7rem 1.6rem; }
#nama { font-size: 2.3rem; font-weight: 700; line-height: 1.2; }
#alamat, #telp { font-size: 1.1rem; color: #bfeae3; line-height: 1.3; }
#waktu { text-align: right; white-space: nowrap; margin-left: 1.5rem; }
#tgl { font-size: 1.3rem; }
#jam { font-size: 2.2rem; font-weight: 700; }

#body { flex: 1; display: flex; padding: 1rem 1.2rem; min-height: 0; }
#vbox { flex: 62; position: relative; background: #0a1517; margin-right: 1.2rem; min-width: 0; }
#vid { width: 100%; height: 100%; background: #000; object-fit: contain; display: block; }
#vph { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center;
  justify-content: center; text-align: center; color: #8fb3ad; font-size: 1.6rem; padding: 2rem;
  white-space: pre-line; }
#vstat { position: absolute; left: .8rem; right: .8rem; top: .8rem; display: none; z-index: 3;
  background: rgba(0,0,0,.65); color: #fff; font-size: 1rem; line-height: 1.35; padding: .45rem .8rem;
  border-radius: .4rem; white-space: pre-line; }

#right { flex: 38; display: flex; flex-direction: column; min-width: 0; }
#called { flex: 3; background: #0e6b67; color: #fff; padding: .9rem 1.6rem; display: flex;
  flex-direction: column; min-height: 0; transition: background .2s; }
#called.flash { background: #f2b705; color: #10252b; }
#ccap { font-size: 1.4rem; font-weight: 700; }
#cnum { flex: 1; min-height: 0; display: flex; align-items: center; }
#cnumtxt { font-weight: 700; line-height: 1; white-space: nowrap; font-size: 11.5rem; transform-origin: left center; }
#called.flash #cnumtxt { animation: pulse .42s ease-in-out infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.04); } }
#cpoli { font-size: 2.1rem; font-weight: 700; line-height: 1.2; }
#cloket { font-size: 1.5rem; line-height: 1.3; }

#board { flex: 2; background: #fff; margin-top: .8rem; padding: .4rem 0; display: flex;
  flex-direction: column; min-height: 0; font-size: 1rem; }
.row { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.2rem; border-bottom: 1px solid #d9e6e2; overflow: hidden; }
.row .nm { font-size: 1.5em; font-weight: 700; line-height: 1.2; color: #10252b; }
.row .if { font-size: 1em; color: #5f7a76; line-height: 1.2; }
.row .kd { font-size: 2.7em; font-weight: 700; color: #0e6b67; margin-left: 1rem; white-space: nowrap; line-height: 1; }

#ftr { flex: none; background: #093f3c; color: #fff; }
#mq { overflow: hidden; white-space: nowrap; height: 3rem; line-height: 3rem; font-size: 1.7rem; font-weight: 700; }
#mqt { display: inline-block; padding-left: 100%; animation: mq 40s linear infinite; }
@keyframes mq { from { transform: translateX(0); } to { transform: translateX(-100%); } }
#mark { text-align: center; color: #a7e3da; font-size: 1rem; padding: .1rem 0 .4rem; }

#unlock { position: absolute; left: 50%; bottom: 1.5rem; margin-left: -19rem; width: 38rem; text-align: center;
  background: #f2b705; color: #10252b; font-size: 1.4rem; font-weight: 700; padding: .7rem 1rem;
  border-radius: .6rem; cursor: pointer; z-index: 5; box-shadow: 0 .3rem 1rem rgba(0,0,0,.3); }
#fsbtn { position: fixed; right: 1rem; bottom: 4.6rem; z-index: 7; width: 2.7rem; height: 2.7rem; border-radius: .5rem;
  background: rgba(0,0,0,.6); cursor: pointer; display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .25s; }
#fsbtn svg { width: 1.7rem; height: 1.7rem; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#fsbtn .ic-off { display: none; }
body.ui #fsbtn { opacity: 1; pointer-events: auto; }
body.isfs #fsbtn .ic-on { display: none; }
body.isfs #fsbtn .ic-off { display: block; }
body.nofs #fsbtn { display: none; }
body.idle { cursor: none; }
#off { position: fixed; left: 0; right: 0; top: 0; background: #c2410c; color: #fff; text-align: center;
  font-size: 1.2rem; padding: .4rem; z-index: 6; display: none; }
#dbg { position: fixed; left: 0; bottom: 0; z-index: 9; background: rgba(0,0,0,.8); color: #7CFC00;
  font: 12px/1.35 monospace; padding: 4px 8px; white-space: pre; display: none; }
</style>
<style id="tema"></style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div>
      <div id="nama">Layar Antrian</div>
      <div id="alamat"></div>
      <div id="telp"></div>
    </div>
    <div id="waktu"><div id="tgl"></div><div id="jam" class="num"></div></div>
  </div>
  <div id="body">
    <div id="vbox">
      <video id="vid" muted autoplay playsinline preload="auto"></video>
      <div id="vph">Video edukasi belum ditambahkan.
Tambahkan lewat menu Video Edukasi di aplikasi.</div>
      <div id="vstat"></div>
      <div id="unlock">Tekan OK / klik sekali untuk suara dan layar penuh</div>
    </div>
    <div id="right">
      <div id="called">
        <div id="ccap">Sedang dipanggil</div>
        <div id="cnum"><span id="cnumtxt" class="num">&mdash;</span></div>
        <div id="cpoli"></div>
        <div id="cloket"></div>
      </div>
      <div id="board"></div>
    </div>
  </div>
  <div id="ftr">
    <div id="mq"><span id="mqt"></span></div>
    <div id="mark"></div>
  </div>
</div>
<div id="off">Menghubungkan ke aplikasi antrian...</div>
<div id="fsbtn" title="Layar penuh (tombol F atau klik dua kali)">
  <svg class="ic-on" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  <svg class="ic-off" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
</div>
<div id="dbg"></div>

<script>
(function () {
  var HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  var BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September',
               'Oktober', 'November', 'Desember'];
  var SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
  var DEBUG = location.search.indexOf('debug') >= 0;
  function $(id) { return document.getElementById(id); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function setText(el, t) { if (el.textContent !== t) { el.textContent = t; } }
  var logs = [];
  function dbg(m) { if (DEBUG) { logs.push(m); if (logs.length > 7) { logs.shift(); } } }

  var offset = 0, tz = 420, vol = 0.4, unlocked = false, voiceOn = true;
  var vid = $('vid');
  var actx = null, chimeBuf = null, chimeEl = null, voiceEl = null;
  var lastSeq = null, lastCall = null, pend = null, safety = null;

  // ---------- tema warna (dikirim aplikasi; tanpa CSS variable agar jalan di browser TV lama) ----------
  var temaId = null;
  function applyTema(t) {
    if (!t || t.id === temaId) { return; }
    temaId = t.id;
    $('tema').textContent =
      'html,body{background:' + t.bg + '}' +
      '#hdr{background:' + t.header + ';color:' + t.header_fg + '}' +
      '#alamat,#telp{color:' + t.header_sub + '}' +
      '#vbox{background:' + t.video_bg + '}#vph{color:' + t.video_fg + '}' +
      '#called{background:' + t.called + ';color:' + t.called_fg + '}' +
      '#called.flash{background:' + t.flash + ';color:' + t.flash_fg + '}' +
      '#board{background:' + t.board + '}.row{border-bottom-color:' + t.row_line + '}' +
      '.row .nm{color:' + t.row_name + '}.row .if{color:' + t.row_info + '}.row .kd{color:' + t.row_num + '}' +
      '#ftr{background:' + t.footer + ';color:' + t.footer_fg + '}#mark{color:' + t.mark + '}' +
      '#unlock{background:' + t.flash + ';color:' + t.flash_fg + '}';
  }

  // ---------- jam & tanggal (waktu server, jadi jam TV yang salah tidak berpengaruh) ----------
  function tick() {
    var t = new Date(new Date().getTime() + offset + tz * 60000);
    setText($('tgl'), HARI[t.getUTCDay()] + ', ' + t.getUTCDate() + ' ' + BULAN[t.getUTCMonth()] + ' ' + t.getUTCFullYear());
    setText($('jam'), pad(t.getUTCHours()) + ':' + pad(t.getUTCMinutes()) + ':' + pad(t.getUTCSeconds()));
  }

  // ---------- angka besar: kecilkan huruf sampai muat ----------
  function fitNumber() {
    var box = $('cnum'), txt = $('cnumtxt');
    var size = Math.round(window.innerHeight * 0.213);
    txt.style.fontSize = size + 'px';
    while (size > 24 && (txt.offsetWidth * 1.05 > box.clientWidth || txt.offsetHeight > box.clientHeight)) {
      size -= 6;
      txt.style.fontSize = size + 'px';
    }
  }

  // ---------- teks berjalan ----------
  var mqText = null;
  function setMarquee(t) {
    if (t === mqText) { return; }
    mqText = t;
    var el = $('mqt');
    el.textContent = t;
    el.style.animationDuration = Math.max(15, (el.scrollWidth + $('mq').clientWidth) / (window.innerHeight * 0.13)) + 's';
  }

  // ---------- daftar layanan ----------
  var rowSig = '', rows = [];
  function setRows(poli) {
    var sig = '', i;
    for (i = 0; i < poli.length; i++) { sig += poli[i].id + ':' + poli[i].nama + '|'; }
    var board = $('board');
    if (sig !== rowSig) {
      rowSig = sig; rows = [];
      while (board.firstChild) { board.removeChild(board.firstChild); }
      for (i = 0; i < poli.length; i++) {
        var r = document.createElement('div'); r.className = 'row';
        var l = document.createElement('div');
        var n = document.createElement('div'); n.className = 'nm';
        var f = document.createElement('div'); f.className = 'if';
        l.appendChild(n); l.appendChild(f);
        var k = document.createElement('div'); k.className = 'kd num';
        r.appendChild(l); r.appendChild(k); board.appendChild(r);
        rows.push({ nm: n, inf: f, kd: k });
      }
      board.style.fontSize = (poli.length > 4 ? 4 / poli.length : 1) + 'rem';
    }
    for (i = 0; i < poli.length; i++) {
      var p = poli[i];
      setText(rows[i].nm, p.nama);
      setText(rows[i].inf, p.menunggu + ' menunggu' + (p.berikut.length ? ', berikut ' + p.berikut.join(', ') : ''));
      setText(rows[i].kd, p.sekarang);
    }
  }

  // ---------- catatan status di atas video (format tidak didukung, error, dll.) ----------
  var statTimer = null, statBase = '';  // catatan teknis hanya tampil sebentar; rincian ada di aplikasi (Video Edukasi)
  function showStat(text) {
    var el = $('vstat');
    el.textContent = text;
    el.style.display = text ? 'block' : 'none';
  }
  function statFlash(msg) {
    showStat(msg);
    clearTimeout(statTimer);
    statTimer = setTimeout(function () { showStat(''); }, 12000);
  }

  // ---------- video edukasi ----------
  var vids = [], vsig = null, vidx = -1, vfail = 0, vtoken = 0, vadv = -1, tLoad = 0;
  var ERR = { 1: 'dibatalkan', 2: 'jaringan', 3: 'gagal didekode', 4: 'format tidak didukung' };
  function applyVol(duck) { try { vid.volume = Math.max(0, Math.min(1, vol * (duck ? 0.12 : 1))); } catch (e) {} }
  function placeholder(show, msg) {
    var ph = $('vph');
    ph.style.display = show ? 'flex' : 'none';
    if (msg) { ph.textContent = msg; }
  }
  function playable(v) {
    if (v.ok === false) { return false; }
    if (v.mime && vid.canPlayType && vid.canPlayType(v.mime) === '') { return false; }
    return true;
  }
  function nextVideo() {
    if (!vids.length) { return; }
    vtoken++; vidx = (vidx + 1) % vids.length; tLoad = new Date().getTime();
    dbg('video -> ' + vids[vidx].url);
    vid.src = vids[vidx].url;
    var p = vid.play();
    if (p && p.catch) { p.catch(function () {}); }
  }
  function advance(delay) {
    if (vadv === vtoken) { return; }
    vadv = vtoken;
    setTimeout(nextVideo, delay || 0);
  }
  function gagal(why) {
    if (vadv === vtoken || !vids.length) { return; }
    vfail++;
    statFlash('Video "' + (vids[vidx] ? vids[vidx].judul : '') + '" gagal diputar (' + why + '). Dilewati.');
    if (vfail > vids.length) {
      vadv = vtoken;
      placeholder(true, 'Video tidak dapat diputar di browser ini (' + why + ').\nGunakan MP4 (H.264 + AAC).');
      return;
    }
    advance(800);
  }
  function resumeVideo() {
    if (!vids.length || vadv === vtoken) { return; }
    if (vid.paused && !vid.ended) {
      var p = vid.play();
      if (p && p.catch) { p.catch(function () {}); }
    }
  }
  vid.addEventListener('ended', function () {
    if (new Date().getTime() - tLoad < 700) { gagal('selesai terlalu cepat'); } else { vfail = 0; advance(0); }
  });
  vid.addEventListener('error', function () {
    var c = vid.error ? vid.error.code : 0;
    dbg('error video kode ' + c);
    gagal(ERR[c] || 'kesalahan tidak dikenal');
  });
  vid.addEventListener('playing', function () { vfail = 0; });
  vid.addEventListener('pause', function () { dbg('video pause'); });

  function syncVideos(list) {
    var good = [], notes = '', i;
    for (i = 0; i < list.length; i++) {
      if (playable(list[i])) { good.push(list[i]); }
      else { notes += (notes ? '\n' : '') + list[i].judul + ': ' + (list[i].catatan || 'format tidak didukung browser ini'); }
    }
    statBase = notes ? 'Dilewati (tidak didukung browser ini):\n' + notes : '';
    var sig = '';
    for (i = 0; i < good.length; i++) { sig += good[i].id + ','; }
    if (sig === vsig) { return; }
    vsig = sig; vids = good; vidx = -1; vfail = 0; vadv = -1;
    if (notes) { statFlash(statBase); } else { showStat(''); }
    if (!vids.length) {
      vid.pause(); vid.removeAttribute('src');
      placeholder(true, list.length
        ? 'Video tidak dapat diputar di browser ini.\nGunakan MP4 (H.264 + AAC).'
        : 'Video edukasi belum ditambahkan.\nTambahkan lewat menu Video Edukasi di aplikasi.');
      return;
    }
    placeholder(false);
    vid.loop = vids.length === 1;
    nextVideo();
  }

  // Pemantau: video yang berhenti sendiri (mis. TV menjeda saat ada suara lain) dilanjutkan; yang macet dilewati.
  var lastT = -1, stuck = 0;
  setInterval(function () {
    if (!vids.length || vadv === vtoken) { return; }
    var t = vid.currentTime;
    if (vid.paused && !vid.ended) { resumeVideo(); stuck = 0; }
    else if (t === lastT && vid.readyState < 3) { stuck++; } else { stuck = 0; }
    lastT = t;
    if (stuck >= 6) { stuck = 0; gagal('macet'); }
  }, 2000);

  // ---------- suara: WebAudio (tidak memakai pemutar media, jadi tidak menghentikan video di TV) ----------
  function loadBuf(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true); x.responseType = 'arraybuffer';
    x.onload = function () {
      if (x.status !== 200) { fail(); return; }
      try { actx.decodeAudioData(x.response, ok, function () { fail(); }); } catch (e) { fail(); }
    };
    x.onerror = fail;
    x.send();
  }
  function playBuf(buf, done) {
    var s = actx.createBufferSource();
    s.buffer = buf; s.connect(actx.destination);
    if (done) { s.onended = done; }
    s.start(0);
  }
  function playChime() {
    try {
      if (actx && chimeBuf) { playBuf(chimeBuf); return; }
      if (chimeEl) { chimeEl.currentTime = 0; var p = chimeEl.play(); if (p && p.catch) { p.catch(function () {}); } }
    } catch (e) {}
  }
  function legacyAudio() {  // cadangan untuk browser tanpa WebAudio
    voiceEl = new Audio(); voiceEl.src = SILENT;
    try { var q = voiceEl.play(); if (q && q.catch) { q.catch(function () {}); } } catch (e) {}
    chimeEl = new Audio('/chime.wav');
    playChime();
  }
  function initAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      try {
        actx = new AC();
        if (actx.resume) { actx.resume(); }
        var b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource();
        s.buffer = b; s.connect(actx.destination); s.start(0);
        loadBuf('/chime.wav', function (buf) { chimeBuf = buf; playChime(); }, function () { actx = null; legacyAudio(); });
        dbg('audio: WebAudio');
        return;
      } catch (e) { actx = null; }
    }
    dbg('audio: elemen Audio');
    legacyAudio();
  }

  // ---------- panggilan: kedip + ting-tung + suara ----------
  function flash() {
    var el = $('called'), n = 0;
    var iv = setInterval(function () {
      n++;
      el.className = (n % 2 === 1 && n < 14) ? 'flash' : '';
      if (n >= 14) { clearInterval(iv); el.className = ''; }
    }, 420);
  }
  function endCall() {
    applyVol(false); pend = null; clearTimeout(safety);
    resumeVideo(); setTimeout(resumeVideo, 800);
  }
  function announce(c) {
    flash();
    if (!unlocked || !voiceOn) { return; }
    var my = { seq: c.seq, chimeDone: false, buf: null, fetching: false, spoke: false };
    pend = my;
    applyVol(true);
    clearTimeout(safety); safety = setTimeout(function () { if (pend === my) { endCall(); } }, 25000);
    playChime();
    setTimeout(function () { if (pend === my) { my.chimeDone = true; tryVoice(); } }, 1400);
  }
  function tryVoice() {
    var c = lastCall, my = pend;
    if (!my || !c || c.seq !== my.seq || my.spoke) { return; }
    if (!c.audio) { if (c.gagal && my.chimeDone) { endCall(); } return; }  // suara belum siap / gagal diunduh
    if (actx) {
      if (!my.buf && !my.fetching) {  // unduh dan dekode lebih awal, selagi ting-tung berbunyi
        my.fetching = true;
        loadBuf(c.audio, function (b) { if (pend === my) { my.buf = b; tryVoice(); } },
                function () { if (pend === my) { endCall(); } });
      }
      if (my.chimeDone && my.buf && !my.spoke) {
        my.spoke = true;
        playBuf(my.buf, function () { if (pend === my) { endCall(); } });
      }
    } else if (my.chimeDone) {
      my.spoke = true;
      voiceEl.onended = voiceEl.onerror = function () { if (pend === my) { endCall(); } };
      voiceEl.src = c.audio;
      var p = voiceEl.play();
      if (p && p.catch) { p.catch(function () { if (pend === my) { endCall(); } }); }
    }
  }
  function handleCall(c) {
    lastCall = c;
    if (lastSeq === null) { lastSeq = c.seq; return; }  // buka halaman: jangan bunyikan panggilan lama
    if (c.seq !== lastSeq) { lastSeq = c.seq; announce(c); }
    tryVoice();
  }

  // ---------- layar penuh (Fullscreen API; browser hanya mengizinkannya lewat klik/tombol dari pengguna) ----------
  var root = document.documentElement, fsAt = 0, uiTimer = null;
  function setClass(name, on) {
    var c = ' ' + document.body.className + ' ';
    var has = c.indexOf(' ' + name + ' ') >= 0;
    if (on && !has) { document.body.className = (document.body.className + ' ' + name).replace(/^\s+/, ''); }
    else if (!on && has) { document.body.className = c.replace(' ' + name + ' ', ' ').replace(/^\s+|\s+$/g, ''); }
  }
  function fsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement ||
           document.msFullscreenElement || null;
  }
  function fsSupported() {
    return !!(root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen);
  }
  function enterFs() {
    var f = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
    if (!f || fsElement()) { return; }
    fsAt = new Date().getTime();
    try { var p = f.call(root); if (p && p.catch) { p.catch(function () {}); } } catch (e) {}
  }
  function exitFs() {
    var f = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (!f) { return; }
    try { var p = f.call(document); if (p && p.catch) { p.catch(function () {}); } } catch (e) {}
  }
  function toggleFs() { if (fsElement()) { exitFs(); } else { enterFs(); } }
  function showUi() {  // tombol layar penuh muncul sebentar saat ada aktivitas; kursor disembunyikan saat diam
    setClass('ui', true); setClass('idle', false);
    clearTimeout(uiTimer);
    uiTimer = setTimeout(function () { setClass('ui', false); setClass('idle', true); }, 3500);
  }
  function fsChanged() { setClass('isfs', !!fsElement()); fitNumber(); showUi(); }
  if (!fsSupported()) { setClass('nofs', true); }
  var fsEvents = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'];
  for (var fi = 0; fi < fsEvents.length; fi++) { document.addEventListener(fsEvents[fi], fsChanged); }

  // ---------- aktifkan suara + layar penuh (browser mewajibkan satu sentuhan/klik) ----------
  function unlock() {
    if (unlocked) { return; }
    unlocked = true;
    $('unlock').style.display = 'none';
    enterFs();
    vid.muted = false; applyVol(false);
    resumeVideo();
    initAudio();
    setTimeout(resumeVideo, 700);
  }
  document.addEventListener('click', unlock);
  document.addEventListener('touchend', unlock);
  document.addEventListener('keydown', function (e) {
    showUi();
    var k = e.key || '';
    if (k === 'f' || k === 'F' || e.keyCode === 70) {  // F = layar penuh
      if (!unlocked) { unlock(); } else { toggleFs(); }
      return;
    }
    unlock();
  });
  document.addEventListener('dblclick', function () {  // klik dua kali = layar penuh (abaikan klik ganda pertama kali)
    if (unlocked && new Date().getTime() - fsAt > 900) { toggleFs(); }
  });
  $('fsbtn').addEventListener('click', function (e) {
    e.stopPropagation();
    if (!unlocked) { unlock(); } else { toggleFs(); }
  });
  document.addEventListener('mousemove', showUi);
  document.addEventListener('mousedown', showUi);
  document.addEventListener('touchstart', showUi);
  showUi();

  // ---------- ambil data dari aplikasi ----------
  function render(st) {
    offset = st.epoch * 1000 - new Date().getTime(); tz = st.tz;
    if (!st.ready) { return; }
    applyTema(st.tema);
    setText($('nama'), st.klinik.nama || '');
    setText($('alamat'), st.klinik.alamat || '');
    setText($('telp'), st.klinik.telepon ? 'Telp/WA ' + st.klinik.telepon : '');
    setText($('mark'), st.mark || '');
    setMarquee(st.teks || '');
    vol = (st.volume || 0) / 100; voiceOn = !!st.suara;
    if (unlocked && !pend) { applyVol(false); }
    setRows(st.poli);
    var t = st.terakhir;
    setText($('cnumtxt'), t ? t.kode : '\u2014'); setText($('cpoli'), t ? t.poli : 'Belum ada panggilan');
    setText($('cloket'), t ? t.loket : '');
    fitNumber();
    syncVideos(st.video || []);
    handleCall(st.call);
  }
  function poll() {
    var x = new XMLHttpRequest();
    x.open('GET', '/api/state?_=' + new Date().getTime(), true);
    x.timeout = 4000;
    x.onload = function () {
      var ok = false;
      try { render(JSON.parse(x.responseText)); ok = true; } catch (e) { dbg('render: ' + e); }
      $('off').style.display = ok ? 'none' : 'block';
      setTimeout(poll, 1000);
    };
    x.onerror = x.ontimeout = function () { $('off').style.display = 'block'; setTimeout(poll, 2000); };
    x.send();
  }

  if (DEBUG) {
    $('dbg').style.display = 'block';
    setInterval(function () {
      $('dbg').textContent = 'suara=' + (unlocked ? 'aktif' : 'belum') + ' layarpenuh=' + (fsElement() ? 'ya' : 'tidak') + ' audio=' + (actx ? actx.state : (chimeEl ? 'Audio' : '-')) +
        ' | video: paused=' + vid.paused + ' t=' + vid.currentTime.toFixed(1) + ' ready=' + vid.readyState +
        ' net=' + vid.networkState + ' err=' + (vid.error ? vid.error.code : 0) + ' (' + (vidx + 1) + '/' + vids.length + ')\n' + logs.join('\n');
    }, 500);
  }

  window.addEventListener('resize', fitNumber);
  setInterval(tick, 500); tick();
  poll();
})();
</script>
</body>
</html>
